matching:
  timestamp_tolerance_seconds: 3.0
  allow_reverse_direction: true

slicing:
  preslice_classes: [BruteForce, DoS, DDoS]
  preslice_time_window_seconds: 30.0
  max_slice_mb: 256

materialization:
  allow_full_env: SECUREEDGE_ALLOW_FULL_OFFICE_MATERIALIZATION
  worker_rss_cap_mb: 6144
  batch_max_candidates: 500
  max_retries: 2

splits:
  standard:
    train: 20000
    val: 2000
    test: 2000
    candidate_pool: 24000
  webbased:
    native_train: 206
    cicids2017_train_only: 167
    train_real: 373
    train_target: 6000
    val: 103
    test: 103
  split_strategy: split_first_then_oversample_train_only

imbalance:
  webbased_policy:
    target_policy: use_all_materialized_real_graphs_no_synthetic_webbased_generation
    split_policy: keep_validation_and_test_native_only
    cicids2017_usage: train_only_when_materialized
    report_source_stratified_webbased: true
    report_bootstrap_macro_f1_ci: true
  loss:
    name: weighted_cross_entropy
    class_weighting:
      method: effective_number
      beta: 0.9999
      normalize_mean_to_one: true
      max_weight: 8.0
  balanced_batches:
    enabled: true
    method: weighted_random_sampler
    replacement: true
    sample_weighting: inverse_class_frequency

graph:
  flow_features: 92
  packet_bytes: 1500
  flow_packet_limit: 20
  compact_feature_version: xgnid_76_plus_temporal_16

architecture_policy:
  current_attention_conv: GATv2Conv
  future_attention_conv: GATv2Conv
  do_not_use: SAGEConv
  rationale: "The office model keeps attention-based neighbor aggregation and now uses GATv2Conv for the office training phase. SAGEConv is intentionally rejected because mean aggregation treats neighbors uniformly."
